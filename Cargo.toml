[package]
name = "md2html-rs"
version = "0.1.0"
edition = "2021"
description = "Markdown → 微信公众号排版 HTML CLI（Rust 实现，样式全内联，可直接复制粘贴发布）"
license = "MIT"
keywords = ["markdown", "wechat", "html", "cli"]

[[bin]]
name = "md2html"
path = "src/main.rs"

[dependencies]
# markdown-rs：remark/micromark 的 Rust 移植，产出标准 mdast（GFM 表格/任务列表/删除线），与 JS 版解析行为对齐
markdown = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# syntect：Sublime 语法引擎；按主题 codeTokens 色板构建高亮主题（regex-fancy 纯 Rust 正则，免 C 依赖）
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy", "dump-load"] }
# 本地 HTTP：ui 编辑器服务
tiny_http = "0.12"
# HTTP 客户端：mermaid.ink 在线渲染 + 微信 API
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
chrono = "0.4"
tempfile = "3"
dirs = "5"
# 文件监听：--watch
notify = "6"

[profile.release]
strip = true
lto = true
