name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release

  # 主平台二进制直接挂到 Release（不走 artifact：账户 Actions 存储配额有限，
  # 且各 job 用 softprops 直传 Release 不需要跨 job 汇总）；打 v* tag 时发布
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: md2html-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: md2html-macos-x64
          # arm64 gnu 交叉编译：私有仓库没有免费 arm 真机 runner
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: md2html-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: md2html-win-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # linux-arm64 交叉编译需要链接器
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - run: cargo build --release --target ${{ matrix.target }}
        if: matrix.target != 'aarch64-unknown-linux-gnu'
      - name: Smoke
        shell: bash
        run: |
          exe=./target/${{ matrix.target }}/release/md2html
          [ -f "$exe.exe" ] && exe="$exe.exe"
          # arm64 交叉产物无法在 x64 runner 上执行，只做存在性检查
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            test -s "$exe"
          else
            "$exe" --list-themes
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          exe=target/${{ matrix.target }}/release/md2html
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" dist/${{ matrix.name }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # linux-x64 单独走 Alpine 容器：musl 全静态（CentOS 7 / Alpine 等老 glibc 系统可直接运行，
  # 与 JS 版 linuxstatic 同理）。Debian 的 musl-gcc wrapper 编不过 ring 的 C 代码（-m64 缺陷），
  # 交叉编译方案不可行，Alpine 原生构建已本地容器实测通过
  release-linux-x64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container: rust:1-alpine
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - name: Smoke
        run: ./target/release/md2html --list-themes
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/md2html dist/md2html-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
